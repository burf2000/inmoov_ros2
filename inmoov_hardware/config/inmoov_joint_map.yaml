    service: i01.leftHand.pinky
    urdf_min_rad: -0.08726646259971647
    urdf_max_rad: 1.4835298641951802
    urdf_home_rad: 0.0
    servo_min: 0.0
    servo_max: 180.0
    servo_rest: 0.0
    mode: floored
    invert: false
    enabled: true
    verified: none

  # --------------------------------------------------------------- torso ----
  # HIGH RISK and the servo-role assignment below is an ASSUMPTION about InMoov
  # convention (lowStom = waist rotation, midStom = side lean). Nobody has confirmed
  # it on this robot. `torso` is deliberately NOT in the default enabled_groups.
  - urdf_joint: waist_pan_joint
    group: torso
    mrl_group: torso
    mrl_servo: lowStom
    service: i01.torso.lowStom
    urdf_min_rad: -1.5707963267948966
    urdf_max_rad:  1.5707963267948966
    urdf_home_rad: 0.0
    servo_min: 0.0
    servo_max: 180.0
    servo_rest: 90.0
    mode: centred
    invert: true
    enabled: true
    verified: live   # direction eyeballed by Simon 2026-07-28: drove the WRONG way with the previous invert, flipped and re-checked
    safety_min: 60.0
    safety_max: 120.0

  - urdf_joint: waist_roll_joint
    group: torso
    mrl_group: torso
    mrl_servo: midStom
    service: i01.torso.midStom
    urdf_min_rad: -0.2617993877991494
    urdf_max_rad:  0.2617993877991494
    urdf_home_rad: 0.0
    servo_min: 60.0
    servo_max: 120.0
    servo_rest: 90.0
    mode: centred
    invert: true
    enabled: true
    verified: live   # direction eyeballed by Simon 2026-07-28: drove the WRONG way with the previous invert, flipped and re-checked

  # --------------------------------------------- parked: no servo exists ----
  # The URDF models each finger as 3-4 chained revolute joints, but the real hand has
  # ONE servo per finger pulling the whole tendon. The "_joint" entry above is the one
  # that is driven (it is also the one controllers.yaml lists); the rest are geometry.
  - { urdf_joint: r_thumb1_joint,  group: rightHand, enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: r_thumb3_joint,  group: rightHand, enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: r_index1_joint,  group: rightHand, enabled: false, reason: one tendon servo per finger }
