  - { urdf_joint: r_pinky3_joint,  group: rightHand, enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: r_pinky4_joint,  group: rightHand, enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_thumb1_joint,  group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_thumb3_joint,  group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_index1_joint,  group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_index3_joint,  group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_middle1_joint, group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_middle3_joint, group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_ring1_joint,   group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_ring3_joint,   group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_ring4_joint,   group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_pinky1_joint,  group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_pinky3_joint,  group: leftHand,  enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: l_pinky4_joint,  group: leftHand,  enabled: false, reason: one tendon servo per finger }
