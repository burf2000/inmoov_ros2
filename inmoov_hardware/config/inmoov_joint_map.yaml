  - { urdf_joint: r_middle1_joint, group: rightHand, enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: r_middle3_joint, group: rightHand, enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: r_ring1_joint,   group: rightHand, enabled: false, reason: one tendon servo per finger }
  - { urdf_joint: r_ring3_joint,   group: rightHand, enabled: false, reason: one tendon servo per finger }
