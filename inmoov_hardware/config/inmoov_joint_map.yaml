    urdf_min_rad: -0.08726646259971647
    urdf_max_rad: 1.4835298641951802
    urdf_home_rad: 0.0
    servo_min: 0.0
    servo_max: 180.0
    servo_rest: 0.0
    mode: floored
    invert: false
    enabled: true
    verified: none

  - urdf_joint: l_pinky_joint
    group: leftHand
